name: Kintsugi AI CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint and syntax check
        run: |
          # Stop the build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --exclude=.venv,__pycache__,build,dist
          # Warning level checks
          flake8 . --count --exit-zero --max-complexity=15 --max-line-length=120 --statistics --exclude=.venv,__pycache__,build,dist

      - name: Run unit test suite
        run: |
          pytest tests/ -v --junitxml=test-results.xml

      - name: Verify package structure
        run: |
          python -c "import backend; import backend.agents; import backend.data; import backend.utils; print('Package structure verified successfully!')"

      - name: Build distributable and smoke test installed wheel
        run: |
          python -m build
          pip install --no-deps dist/*.whl
          cd /tmp
          python -c "from backend.data.loader import load_customer_data; from backend.config import ASSETS_DIR; assert len(load_customer_data()) == 2240; assert (ASSETS_DIR / 'kintsugi_logo_thumb.png').exists()"
