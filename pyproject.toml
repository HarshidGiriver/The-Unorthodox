[build-system]
requires = ["setuptools==84.0.0", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kintsugi-ai"
version = "0.2.0"
description = "Kintsugi AI - Proactive financial distress detection and debt restructuring engine"
readme = "README.md"
authors = [{ name = "Kintsugi AI Team" }]
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Office/Business :: Financial",
]
dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    "joblib>=1.3.0",
    "python-dotenv>=1.0.0",
    "streamlit>=1.30.0",
    "plotly>=5.18.0",
    "requests>=2.31.0",
    "tzdata>=2026.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "flake8>=6.1.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"

[tool.flake8]
max-line-length = 120
extend-ignore = ["E203", "W503"]
exclude = [".git", "__pycache__", "build", "dist", ".venv"]

[tool.setuptools.packages.find]
include = ["frontend*", "backend*", "integration*"]

[tool.setuptools.package-data]
frontend = ["styles/*.css"]

[project.scripts]
kintsugi = "frontend.launch:main"
